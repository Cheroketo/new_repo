name: FastAPI CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check
        run: python -m compileall app src

      - name: Run tests
        run: pytest -q

  build-image:
    name: Build image with Kaniko
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image with Kaniko
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        with:
          args: >-
            --context=dir://${{ github.workspace }}
            --dockerfile=Dockerfile
            --destination=ml-api:${{ github.sha }}
            --no-push